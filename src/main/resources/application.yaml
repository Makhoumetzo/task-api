spring:
  application:
    name: task-api

  # ── Base de données MySQL ───────────────────────────────────────────────────
  # host.docker.internal permet au conteneur Docker d'atteindre MySQL sur la machine hôte
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/taskmanager_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: taskapp
    password: taskpass123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ── Serveur ────────────────────────────────────────────────────────────────────
server:
  port: 8085
